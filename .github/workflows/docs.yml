name: Documentation and demo

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "demo-site/**"
      - "components/**"
      - "app/globals.css"
      - "app/styles/**"
      - "lib/**"
      - "public/doot-mark.svg"
      - "scripts/build-static-demo.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Moat and JavaScript dependencies
        run: |
          go install github.com/oddship/moat@v0.6.2
          npm ci
      - name: Build documentation and frozen demo
        run: |
          moat build docs _site
          npm run demo:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
