name: UI audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widescreen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start Doot
        run: npm start &
      - name: Wait for Doot
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/api/health && exit 0
            sleep 1
          done
          exit 1
      - run: npm run test:ui
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: widescreen-ui-audit
          path: artifacts/ui-audit
